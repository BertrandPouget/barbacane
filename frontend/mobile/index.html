<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#140d08" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Barbacane</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧱</text></svg>" />
  <link rel="stylesheet" href="/mobile/mobile.css" />
</head>
<body>

<!-- Sfondo dinamico: braci fluttuanti -->
<div id="bg-embers" aria-hidden="true">
  <span></span><span></span><span></span><span></span><span></span><span></span>
</div>

<!-- ═══════════ SCHERMATA: LOBBY ═══════════ -->
<section id="scr-lobby" class="scr active">
  <div class="lobby-scroll">
    <div class="lobby-hero">
      <img src="/assets/logo_color.png" alt="" class="lobby-logo"
           onerror="this.style.display='none'" />
      <h1 class="lobby-title">BARBACANE</h1>
      <p class="lobby-tagline">Evoca · Costruisci · Assedia</p>
    </div>

    <div class="seg-tabs glass" role="tablist">
      <button id="tab-create" class="seg-tab on" data-pane="pane-create">Crea partita</button>
      <button id="tab-join" class="seg-tab" data-pane="pane-join">Unisciti</button>
      <span class="seg-thumb" aria-hidden="true"></span>
    </div>

    <div id="pane-create" class="lobby-pane glass">
      <label class="fld">
        <span>Il tuo nome</span>
        <input type="text" id="in-create-name" placeholder="Nome giocatore" maxlength="20" autocomplete="nickname" />
      </label>
      <label class="fld">
        <span>Timer turno — secondi, 0 = nessuno</span>
        <input type="number" id="in-create-timer" value="120" min="0" max="600" inputmode="numeric" />
      </label>
      <button id="btn-create" class="cta cta-gold">⚑ Crea lobby</button>
    </div>

    <div id="pane-join" class="lobby-pane glass" hidden>
      <label class="fld">
        <span>Il tuo nome</span>
        <input type="text" id="in-join-name" placeholder="Nome giocatore" maxlength="20" autocomplete="nickname" />
      </label>
      <label class="fld">
        <span>Codice lobby</span>
        <input type="text" id="in-join-code" placeholder="BARB-XXXX" maxlength="9" autocapitalize="characters" autocomplete="off" />
      </label>
      <button id="btn-join" class="cta">➤ Entra nella lobby</button>
    </div>

    <a class="desktop-link" href="/?desktop=1">🖥 Passa alla versione desktop</a>
  </div>
</section>

<!-- ═══════════ SCHERMATA: SALA D'ATTESA ═══════════ -->
<section id="scr-wait" class="scr">
  <div class="wait-wrap">
    <h2 class="wait-title">Sala d'attesa</h2>
    <button id="wait-code" class="code-chip glass" title="Tocca per copiare">
      <span id="wait-code-text">—</span>
      <span class="code-copy">copia</span>
    </button>
    <div id="wait-players" class="wait-players"></div>
    <p class="wait-hint">Condividi il codice con i tuoi amici.<br>Servono almeno 2 giocatori.</p>
    <button id="btn-start" class="cta cta-gold" hidden>⚔ Avvia partita</button>
    <div id="wait-status" class="wait-status"></div>
  </div>
</section>

<!-- ═══════════ SCHERMATA: GIOCO ═══════════ -->
<section id="scr-game" class="scr">

  <!-- Barra superiore -->
  <header id="topbar" class="glass">
    <div class="tb-left">
      <span id="tb-turn" class="tb-pill">T1</span>
      <span id="tb-deck" class="tb-pill">🂠 —</span>
    </div>
    <div id="tb-phase" class="tb-phase" aria-label="Fase del turno">
      <span class="ph-dot" data-ph="action"><i></i><em>Azioni</em></span>
      <span class="ph-dot" data-ph="schieramento"><i></i><em>Schiera</em></span>
      <span class="ph-dot" data-ph="battaglia"><i></i><em>Battaglia</em></span>
    </div>
    <div class="tb-right">
      <div id="tb-timer" class="tb-timer" hidden>
        <svg viewBox="0 0 36 36"><circle class="ring-bg" cx="18" cy="18" r="15.5"/><circle id="timer-ring" class="ring-fg" cx="18" cy="18" r="15.5"/></svg>
        <span id="tb-timer-num">—</span>
      </div>
      <button id="tb-log" class="tb-btn" aria-label="Registro eventi">📜</button>
    </div>
  </header>

  <!-- Avversari -->
  <div id="opp-rail"></div>

  <!-- Ticker eventi -->
  <button id="ticker" class="ticker" hidden></button>

  <!-- Campo -->
  <main id="field">
    <div id="fld-vanguard" class="zone-vanguard">
      <div class="zone-label"><span>⚔ Avanscoperta</span></div>
      <div id="vg-cards" class="vg-cards"></div>
    </div>

    <div id="towers">
      <button id="tw-left" class="tower" data-side="left">
        <span class="tower-name">Bastione S.</span>
        <span class="tower-walls"><b id="tw-left-walls">0</b>🧱</span>
        <span id="tw-left-dots" class="tower-dots"></span>
        <span id="tw-left-threat" class="tower-threat"></span>
      </button>
      <button id="tw-village" class="tower tower-village">
        <span class="tower-name">Villaggio</span>
        <span class="tower-walls"><b id="tw-village-count">0</b>🏛</span>
        <span id="tw-village-badge" class="tower-badge" hidden>da completare</span>
      </button>
      <button id="tw-right" class="tower" data-side="right">
        <span class="tower-name">Bastione D.</span>
        <span class="tower-walls"><b id="tw-right-walls">0</b>🧱</span>
        <span id="tw-right-dots" class="tower-dots"></span>
        <span id="tw-right-threat" class="tower-threat"></span>
      </button>
    </div>
  </main>

  <!-- Stato personale -->
  <div id="statusbar">
    <button id="st-lives" class="st-chip" aria-label="Le tue vite">❤ —</button>
    <div id="st-mana" class="st-chip" aria-label="Mana">💎 —</div>
    <div id="st-actions" class="st-chip" aria-label="Azioni">● ●</div>
    <button id="st-fx" class="st-chip st-fx" hidden aria-label="Effetti attivi">✨ 0</button>
  </div>

  <!-- Dock azioni contestuale -->
  <div id="dock-wrap">
    <div id="wall-tray" class="glass" hidden>
      <div class="tray-head">🧱 Muri <b id="tray-count">0</b>/3 <span class="tray-hint">tocca le carte in mano</span></div>
      <div id="tray-list"></div>
      <div class="tray-actions">
        <button id="tray-cancel" class="mbtn">Annulla</button>
        <button id="tray-confirm" class="mbtn mbtn-gold" disabled>Conferma</button>
      </div>
    </div>
    <div id="dock" class="glass"></div>
  </div>

  <!-- Mano -->
  <div id="hand-wrap">
    <div id="hand"></div>
  </div>

</section>

<!-- ═══════════ SCHERMATA: FINE PARTITA ═══════════ -->
<section id="scr-over" class="scr">
  <div id="confetti" aria-hidden="true"></div>
  <div class="over-wrap">
    <div class="over-trophy">🏆</div>
    <h1 id="over-title">Fine partita</h1>
    <p id="over-winner"></p>
    <div id="over-scores" class="glass"></div>
    <button class="cta cta-gold" onclick="location.href='/m'">Torna alla lobby</button>
  </div>
</section>

<!-- ═══════════ OVERLAY GLOBALI ═══════════ -->
<div id="scrim" hidden></div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-grab" id="sheet-grab"><span></span></div>
  <div class="sheet-head">
    <div id="sheet-title" class="sheet-title"></div>
    <div id="sheet-sub" class="sheet-sub"></div>
  </div>
  <div id="sheet-body" class="sheet-body"></div>
  <div id="sheet-foot" class="sheet-foot"></div>
</div>

<div id="turn-banner" hidden><span id="turn-banner-text"></span></div>
<div id="toasts"></div>

<script src="/ws.js"></script>
<script src="/mobile/ui.js"></script>
<script src="/mobile/render.js"></script>
<script src="/mobile/app.js"></script>
</body>
</html>
