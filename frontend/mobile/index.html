<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#140d08" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Barbacane</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧱</text></svg>" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/assets/logo_app.png" />
  <meta name="apple-mobile-web-app-title" content="Barbacane" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Caudex:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/mobile/mobile.css" />
</head>
<body>

<canvas id="sparks-canvas"></canvas>
<audio id="bgm-audio" src="/assets/Tower-Defense_Looping.ogg" loop preload="none"></audio>
<button id="btn-music-toggle" class="music-toggle" aria-label="Attiva/disattiva musica" title="Musica">♪</button>

<!-- ═══════════ SCHERMATA: SPLASH ═══════════ -->
<section id="scr-splash" class="scr active">
  <div class="splash-tap">
    <img src="/assets/logo.png" alt="Barbacane" class="splash-logo" id="splash-logo"
         onerror="this.style.display='none'; document.getElementById('splash-title').classList.add('show')" />
    <h1 class="splash-title-fallback" id="splash-title">BARBACANE</h1>
  </div>
</section>

<!-- ═══════════ SCHERMATA: LOBBY ═══════════ -->
<section id="scr-lobby" class="scr">
  <div class="lobby-scroll">
    <div class="lobby-hero">
      <img src="/assets/logo.png" alt="" class="lobby-logo"
           onload="document.querySelector('.lobby-title').style.display='none'"
           onerror="this.style.display='none'" />
      <h1 class="lobby-title">BARBACANE</h1>
    </div>

    <!-- Le tre voci della home: banner orizzontali uno sotto l'altro, titolo a
         sinistra e personaggio a destra -->
    <div id="home-modes" class="home-modes">
      <!-- Partita in corso salvata nel browser (session.js): compare solo se è ancora
           in gioco, come prima voce del menu (Gioca passa allora da alto a centro) -->
      <button id="btn-resume" class="home-mode home-resume menu-frame menu-frame-alto" hidden>
        <span class="home-mode-text"><span class="home-mode-title">Riprendi</span><span id="btn-resume-sub" class="home-mode-desc"></span></span>
        <span class="home-mode-art"><img src="/assets/home/orfeo.png" alt="" class="art-orfeo" /></span>
      </button>
      <button id="btn-mode-play" class="home-mode menu-frame menu-frame-alto">
        <span class="home-mode-text"><span class="home-mode-title">Gioca</span><span class="home-mode-desc">Crea una partita o unisciti a quella di un amico, anche contro i Bot.</span></span>
        <span class="home-mode-art"><img src="/assets/home/patrizio.png" alt="" class="art-patrizio" /></span>
      </button>
      <button id="btn-tutorial" class="home-mode menu-frame menu-frame-centro">
        <span class="home-mode-text"><span class="home-mode-title">Tutorial</span><span class="home-mode-desc">Una breve partita guidata per imparare le regole giocando.</span></span>
        <span class="home-mode-art"><img src="/assets/home/evelyn.png" alt="" class="art-evelyn" /></span>
      </button>
      <button id="btn-catalog" class="home-mode menu-frame menu-frame-basso">
        <span class="home-mode-text"><span class="home-mode-title">Catalogo</span><span class="home-mode-desc">Tutte le carte del gioco, da sfogliare con calma.</span></span>
        <span class="home-mode-art"><img src="/assets/home/faust.png" alt="" class="art-faust" /></span>
      </button>
    </div>
  </div>
</section>

<!-- ═══════════ SCHERMATA: MULTIGIOCATORE (crea / unisciti) ═══════════ -->
<section id="scr-multi" class="scr">
  <header id="multi-head" class="glass">
    <button id="multi-back" class="tb-btn" aria-label="Torna alla home">‹</button>
    <span class="cat-title">Gioca</span>
  </header>
  <div id="multi-scroll">
    <!-- Crea partita / Unisciti: due pagine che scorrono di lato, con i pallini sotto -->
    <div class="pager-wrap">
    <div id="multi-pager" class="pager">
    <div id="pane-create" class="lobby-pane menu-frame">
      <h2 class="pane-title">Crea partita</h2>
      <label class="fld">
        <span>Il tuo nome</span>
        <input type="text" id="in-create-name" placeholder="Nome giocatore" maxlength="20" autocomplete="nickname" />
      </label>
      <label class="fld">
        <span>Timer turno — secondi, 0 = nessuno</span>
        <input type="number" id="in-create-timer" value="0" min="0" max="600" inputmode="numeric" />
      </label>
      <button id="btn-create" class="cta cta-gold">Crea lobby</button>
    </div>

    <div id="pane-join" class="lobby-pane menu-frame">
      <h2 class="pane-title">Unisciti</h2>
      <label class="fld">
        <span>Il tuo nome</span>
        <input type="text" id="in-join-name" placeholder="Nome giocatore" maxlength="20" autocomplete="nickname" />
      </label>
      <label class="fld">
        <span>Codice lobby</span>
        <input type="text" id="in-join-code" placeholder="BARB-XXXX" maxlength="9" autocapitalize="characters" autocomplete="off" />
      </label>
      <button id="btn-join" class="cta">Entra nella lobby</button>
    </div>
    </div>
    <div id="multi-dots" class="pager-dots" aria-hidden="true"><span class="on"></span><span></span></div>
    </div>
  </div>
</section>

<!-- ═══════════ SCHERMATA: SFIDA UN BOT (scelta difficoltà) ═══════════ -->
<section id="scr-bot-difficulty" class="scr">
  <header id="bot-diff-head" class="glass">
    <button id="bot-diff-back" class="tb-btn" aria-label="Torna alla lobby">‹</button>
    <span class="cat-title">Giocatore singolo</span>
  </header>
  <div id="bot-diff-scroll">
    <div class="bot-count-row">
      <span class="bot-count-label">Avversari</span>
      <div class="bot-count-options" role="radiogroup" aria-label="Numero di Bot avversari">
        <button class="bot-count-btn selected" data-bots="1" role="radio" aria-checked="true">1</button>
        <button class="bot-count-btn" data-bots="2" role="radio" aria-checked="false">2</button>
        <button class="bot-count-btn" data-bots="3" role="radio" aria-checked="false">3</button>
      </div>
      <span class="bot-count-hint">Partita da 2 giocatori</span>
    </div>
    <button class="menu-frame difficulty-card difficulty-easy" data-difficulty="easy">
      <div class="difficulty-card-title">🟢 Facile</div>
      <div class="difficulty-card-desc">Valuta le carte una alla volta e non sceglie sempre la mossa migliore. Ottimo per i primi passi dopo il tutorial.</div>
    </button>
    <button class="menu-frame difficulty-card difficulty-normal" data-difficulty="normal">
      <div class="difficulty-card-title">🟡 Normale</div>
      <div class="difficulty-card-desc">Pianifica insieme le 2 Azioni del turno e sceglie sempre la combinazione migliore.</div>
    </button>
    <button class="menu-frame difficulty-card difficulty-hard" data-difficulty="hard">
      <div class="difficulty-card-title">🔴 Difficile</div>
      <div class="difficulty-card-desc">Simula l'intero turno, stima le mosse possibili degli avversari e bilancia attacco e difesa dei Bastioni.</div>
    </button>
  </div>
</section>

<!-- ═══════════ SCHERMATA: CATALOGO CARTE ═══════════ -->
<section id="scr-catalog" class="scr">
  <header id="cat-head" class="glass">
    <button id="cat-back" class="tb-btn" aria-label="Torna alla lobby">‹</button>
    <span class="cat-title">Catalogo</span>
  </header>
  <div id="cat-scroll">
    <div id="cat-grid"></div>
  </div>
</section>

<!-- ═══════════ SCHERMATA: SALA D'ATTESA ═══════════ -->
<section id="scr-wait" class="scr">
  <header id="wait-head" class="glass">
    <button id="wait-back" class="tb-btn" aria-label="Esci dalla sala d'attesa">‹</button>
    <span class="cat-title">Sala d'attesa</span>
  </header>
  <div class="wait-wrap">
    <div class="wait-card menu-frame">
      <div class="wait-code-row">
        <button id="wait-code" class="wait-code" aria-label="Copia il codice della sala">
          <span id="wait-code-text">—</span>
        </button>
        <button id="btn-share-invite" class="cta cta-gold share-invite">Invita</button>
      </div>

      <div id="wait-players" class="wait-seats"></div>

      <div id="wait-bots" class="wait-botdiff" hidden>
        <span class="wait-botdiff-label">Difficoltà dei Bot</span>
        <div class="wait-diff" role="radiogroup" aria-label="Difficoltà dei Bot">
          <button class="wait-diff-btn" data-diff="easy" role="radio">Facile</button>
          <button class="wait-diff-btn" data-diff="normal" role="radio">Normale</button>
          <button class="wait-diff-btn" data-diff="hard" role="radio">Difficile</button>
        </div>
      </div>

      <button id="btn-start" class="cta cta-gold wait-start" hidden>Avvia partita</button>
      <div id="wait-status" class="wait-status"></div>
    </div>
  </div>
</section>

<!-- ═══════════ SCHERMATA: GIOCO ═══════════ -->
<section id="scr-game" class="scr">

  <!-- Intestazione: turno, mazzo, fasi, Abbandona e musica; sotto l'ultima
       voce della cronaca -->
  <header id="topbar" class="menu-frame menu-frame-basso">
    <div class="tb-row">
      <span id="tb-turn" class="tb-pill">T1</span>
      <span id="tb-deck" class="tb-pill" aria-label="Carte nel mazzo"><i class="tb-deck-ico"></i><span id="tb-deck-n">—</span></span>
      <div id="tb-phase" class="tb-phase" aria-label="Fase del turno">
        <span class="ph-dot" data-ph="action"><i></i><em>Azioni</em></span>
        <span class="ph-dot" data-ph="schieramento"><i></i><em>Schiera</em></span>
        <span class="ph-dot" data-ph="battaglia"><i></i><em>Battaglia</em></span>
      </div>
      <div class="tb-right">
        <button id="tb-leave" class="tb-btn tb-leave" aria-label="Abbandona la partita">Abbandona</button>
      </div>
    </div>
    <!-- Ultima voce della cronaca: toccandola si legge tutta -->
    <button id="ticker" class="ticker" type="button" aria-label="Cronaca della partita"></button>
    <!-- Timer del turno (solo se impostato nella sala d'attesa) -->
    <div id="tb-timer" class="tb-timer" hidden><i id="timer-bar"></i><span id="tb-timer-num">—</span></div>
  </header>

  <!-- Pannello del Tutorial: si piazza accanto alla zona evidenziata (spotlight.js) -->
  <div id="tutorial-panel" class="tut-panel menu-frame menu-frame-small" hidden>
    <div id="tutorial-panel-progress" class="tut-panel-progress"></div>
    <div id="tutorial-panel-title" class="tut-panel-title"></div>
    <div id="tutorial-panel-text" class="tut-panel-text"></div>
    <div id="tutorial-panel-diagram" hidden></div>
    <ul id="tutorial-panel-goals" class="tut-goals" hidden></ul>
    <div class="tut-panel-actions">
      <div class="tut-panel-nav">
        <button id="tutorial-panel-prev" class="mbtn tut-arrow" hidden aria-label="Indietro">‹</button>
        <button id="tutorial-panel-next" class="mbtn mbtn-gold" aria-label="Avanti">›</button>
      </div>
    </div>
  </div>


  <!-- Campo (board.js): al centro le Regioni del giocatore osservato (di solito
       io), attorno quelle dei vicini: accanto all'Avanscoperta i Bastioni
       esposti, accanto ai Bastioni le Avanscoperte che li minacciano. Sopra, i
       nomi degli altri giocatori con l'occhio per guardare il loro campo. -->
  <main id="field">
    <div id="board">
      <div id="opp-rail"></div>
    </div>
  </main>

  <!-- Le mie Azioni, Vite e Mana -->
  <div id="statusbar">
    <div id="st-actions" class="st-item" role="img" aria-label="Azioni"><span class="st-pips"></span><span class="st-lbl">Azioni</span></div>
    <i class="st-sep"></i>
    <button id="st-lives" class="st-item" type="button" aria-label="Le tue Vite"><span class="st-hearts"></span><span class="st-lbl">Vite</span></button>
    <i class="st-sep"></i>
    <div id="st-mana" class="st-item" role="img" aria-label="Mana"><span class="st-gem"><b id="st-mana-n">0</b></span><span class="st-lbl">Mana</span></div>
    <button id="st-fx" class="st-item st-fx" type="button" hidden aria-label="Effetti attivi">✨ 0</button>
  </div>

  <!-- Suggerimento della fase e i suoi pulsanti (fase successiva, Orda, Attacca, Fine turno) -->
  <div id="dock"></div>

  <!-- Mano -->
  <div id="hand-wrap">
    <div id="hand"></div>
  </div>

</section>

<!-- ═══════════ SCHERMATA: FINE PARTITA ═══════════ -->
<section id="scr-over" class="scr">
  <div id="confetti" aria-hidden="true"></div>
  <div class="over-wrap">
    <h1 id="over-title">Fine partita</h1>
    <p id="over-winner"></p>
    <div id="over-scores"></div>
    <p id="over-rematch-note" class="over-note" hidden></p>
    <button id="btn-rematch" class="cta cta-gold" hidden>Rivincita</button>
    <button id="btn-over-log" class="cta">Rivedi la cronaca</button>
    <button class="cta" onclick="location.href='/m'">Torna alla home</button>
  </div>
</section>

<!-- ═══════════ OVERLAY GLOBALI ═══════════ -->
<div id="scrim" hidden></div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-grab" id="sheet-grab"><span></span></div>
  <div class="sheet-head">
    <div id="sheet-title" class="sheet-title"></div>
    <div id="sheet-sub" class="sheet-sub"></div>
  </div>
  <div id="sheet-body" class="sheet-body"></div>
  <div id="sheet-foot" class="sheet-foot"></div>
</div>

<div id="turn-banner" hidden><span id="turn-banner-text"></span></div>
<div id="toasts"></div>

<script src="/sparks.js"></script>
<script src="/audio.js"></script>
<script src="/ws.js"></script>
<script src="/spotlight.js"></script>
<script src="/tutorial_diagram.js"></script>
<script src="/dice.js"></script>
<script src="/chronicle.js"></script>
<script src="/session.js"></script>
<script src="/cardart.js"></script>
<script src="/motion.js"></script>
<script src="/drag.js"></script>
<script src="/mobile/ui.js"></script>
<script src="/mobile/board.js"></script>
<script src="/mobile/render.js"></script>
<script src="/mobile/app.js"></script>
</body>
</html>
