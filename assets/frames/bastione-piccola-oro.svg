<!-- Cornice a bastione dei pannelli dei menu (border-image, slice 30): solo
     il contorno. Il marrone del pannello è un riempimento CSS con la stessa
     sagoma (.menu-frame::before, clip-path): dentro l'immagine, stirata a
     pezzi, la trasparenza lascerebbe righe più scure nei punti di taglio. Le punte
     hanno un tratto più sottile dei lati: le diagonali, nette, altrimenti
     sembrerebbero più spesse dei lati dritti, che cadono tra due pixel. -->
<svg xmlns="http://www.w3.org/2000/svg" width="90" height="90" viewBox="0 0 90 90">
  <polyline points="24,16 66,16" fill="none" stroke-linecap="round" stroke="#fbc402" stroke-width="1.1" stroke-linejoin="miter"/>
  <polyline points="74,24 74,66" fill="none" stroke-linecap="round" stroke="#fbc402" stroke-width="1.1" stroke-linejoin="miter"/>
  <polyline points="66,74 24,74" fill="none" stroke-linecap="round" stroke="#fbc402" stroke-width="1.1" stroke-linejoin="miter"/>
  <polyline points="16,66 16,24" fill="none" stroke-linecap="round" stroke="#fbc402" stroke-width="1.1" stroke-linejoin="miter"/>
  <polyline points="16,24 12,12 24,16" fill="none" stroke-linecap="round" stroke="#fbc402" stroke-width="0.9" stroke-linejoin="miter" stroke-miterlimit="3"/>
  <polyline points="66,16 78,12 74,24" fill="none" stroke-linecap="round" stroke="#fbc402" stroke-width="0.9" stroke-linejoin="miter" stroke-miterlimit="3"/>
  <polyline points="74,66 78,78 66,74" fill="none" stroke-linecap="round" stroke="#fbc402" stroke-width="0.9" stroke-linejoin="miter" stroke-miterlimit="3"/>
  <polyline points="24,74 12,78 16,66" fill="none" stroke-linecap="round" stroke="#fbc402" stroke-width="0.9" stroke-linejoin="miter" stroke-miterlimit="3"/>
</svg>
